
name: RideLink CI Pipeline

on:
  push:
    branches:
      - main
      - 'feature-branch/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - account-service
          - driver-service
          - fare-service
          - ride-service

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Give Maven Wrapper Permission
        working-directory: ${{ matrix.service }}
        run: chmod +x mvnw   

      - name: Build and Test
        working-directory: ${{ matrix.service }}
        run: ./mvnw clean verify
